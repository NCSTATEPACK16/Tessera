<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` for the safe-area insets the tray and top bar use;
         `user-scalable=no` because the board owns pinch, and Safari's page zoom
         would fight the camera for it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0D10" />
    <title>Tessera</title>

    <!-- iOS ignores the web manifest for home-screen presentation — these
         three are what actually make "Add to Home Screen" look and behave
         like an installed app rather than a bookmark with Safari chrome. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tessera" />
    <link rel="icon" href="/favicon.png" />
    <!-- Fonts are bundled from @fontsource in src/main.tsx, not linked here. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
