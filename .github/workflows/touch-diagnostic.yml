# THROWAWAY — delete with the diag/touch-scroll-ci branch.
# Runs only the touch diagnostic, so evidence comes back in ~3 minutes
# instead of riding the full 23-minute browser suite.
name: Touch scroll diagnostic

on: [pull_request]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test test/browser/touch-diagnostic.spec.ts --project=dock --reporter=list
